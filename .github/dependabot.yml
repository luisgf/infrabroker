# Automated dependency update PRs. Go modules, GitHub Actions and the Docker
# base-image digests; every ecosystem is gated by the same required checks as
# any other PR.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # Batch minor/patch bumps into one PR to keep review overhead low for a
      # single maintainer; majors still arrive individually.
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The release image (Dockerfile) and the Glama introspection image
  # (contrib/glama/Dockerfile) pin gcr.io/distroless/static-debian12:nonroot by
  # digest; Dependabot keeps the digest current so the pin does not go stale.
  - package-ecosystem: docker
    directories:
      - /
      - /contrib/glama
    schedule:
      interval: weekly
