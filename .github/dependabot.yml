# Automated dependency update PRs. Go modules, GitHub Actions, the pinned docs
# toolchain (pip) and the Docker base images; every ecosystem is gated by the
# same required checks as any other PR.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # Batch minor/patch bumps into one PR to keep review overhead low for a
      # single maintainer; majors still arrive individually.
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The docs toolchain that gates CI: docs.yml installs requirements-docs.txt,
  # a pip-compile lock with hashes generated from requirements-docs.in
  # (mkdocs-material is the one top-level pin). Dependabot bumps the lock and
  # its hashes; without this entry the pins can only rot.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  # The release image (Dockerfile) and the Glama introspection image
  # (contrib/glama/Dockerfile) pin gcr.io/distroless/static-debian12:nonroot by
  # digest; Dependabot keeps the digest current so the pin does not go stale.
  # The two demo images (examples/compose/pki-init and examples/compose/sshd)
  # track an alpine release tag that Dependabot bumps.
  - package-ecosystem: docker
    directories:
      - /
      - /contrib/glama
      - /examples/compose/pki-init
      - /examples/compose/sshd
    schedule:
      interval: weekly
