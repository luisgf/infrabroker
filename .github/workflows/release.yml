name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 fetches the full history and tags so `git describe --tags`
      # in `make dist` resolves the release version to inject into the binaries,
      # and so goreleaser can compute the changelog range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Test (race)
        run: go test -race ./...

      # Build the SAME artifact as the documented install path (OPERATIONS §8):
      # `make dist` produces dist/infrabroker-<version>.tar.gz with every binary
      # in the Makefile's CMDS list (incl. control-plane, which the shipped
      # systemd unit execs), version-injected, plus deploy/ and the example
      # configs. Deliberately not a hard-coded count here: CMDS is the single
      # source of truth and has grown with approval-bridge (#120) and
      # infrabroker-shim (#144). goreleaser attaches the tarball to the release
      # via release.extra_files; its own archives live in dist-goreleaser/ so
      # `release --clean` never wipes this one.
      - name: Build installer tarball
        run: make dist

      # checksums.txt is goreleaser's (covers the per-platform archives); the
      # installer tarball gets its own sidecar to avoid the name collision.
      - name: Checksum installer tarball
        run: cd dist && sha256sum infrabroker-*.tar.gz > installer.sha256

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single owner of the GitHub release: goreleaser creates it, uploads the
      # per-platform archives + checksums.txt + the installer tarball, pushes
      # the per-arch images to ghcr and stitches the multi-arch manifests.
      - name: goreleaser release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          # Exact goreleaser release (like the pinned mcp-publisher): a floating '~> v2'
          # would build each tag with whatever v2.x is newest at push time.
          # bump deliberately via the release skill
          version: 'v2.18.3'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish server.json to the MCP Registry after the image is live. The registry
  # validates OCI ownership by pulling the image referenced in server.json and
  # reading its io.modelcontextprotocol.server.name label, so this MUST run after
  # the release job has pushed ghcr.io/luisgf/infrabroker:<version>. Auth is
  # GitHub Actions OIDC (id-token) — it proves the io.github.luisgf namespace
  # belongs to this repo's owner, so no PAT or stored secret is needed.
  mcp-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Pinned publisher from github.com/modelcontextprotocol/registry; the
      # installed binary is named `publisher`.
      - name: Install mcp-publisher
        run: go install github.com/modelcontextprotocol/registry/cmd/publisher@v1.7.9

      # server.json is the tagged revision (checkout defaults to the tag ref), so
      # its version and OCI identifier are EXPECTED to match the release just
      # published — but a tag pushed without the /release bump would publish
      # stale registry metadata pointing at an older image. Assert the
      # invariant before publishing instead of trusting the comment.
      - name: Assert server.json matches the release tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          got_version="$(jq -r .version server.json)"
          got_identifier="$(jq -r '.packages[0].identifier' server.json)"
          want_identifier="ghcr.io/luisgf/infrabroker:${v}"
          test "$got_version" = "$v" \
            || { echo "::error file=server.json::.version is '$got_version', tag says '$v'"; exit 1; }
          test "$got_identifier" = "$want_identifier" \
            || { echo "::error file=server.json::.packages[0].identifier is '$got_identifier', want '$want_identifier'"; exit 1; }
          echo "server.json version ${v} and OCI identifier ${want_identifier} match the tag"

      # login writes a short-lived registry token consumed by publish in the same
      # job.
      - name: Publish server.json to the MCP Registry
        run: |
          publisher login github-oidc
          publisher publish
